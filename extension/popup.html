<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    h1 {
      font-size: 18px;
      margin-top: 0;
    }
    button {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
    .status {
      margin: 10px 0;
      padding: 10px;
      border-radius: 4px;
      background-color: #f0f0f0;
    }
  </style>
</head>
<body>
  <h1>SafeAI Assistant</h1>
  <div class="status" id="status">Ready to protect your AI interactions</div>
  <button id="documentWizard">Work Safely with Document</button>
  <button id="dashboard">View Dashboard</button>
  <button id="settings">Settings</button>
  
  <script src="popup.js"></script>
</body>
</html>
